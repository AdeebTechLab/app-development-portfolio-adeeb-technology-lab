    <meta property="og:title" content="App Development Company | Adeeb Technology Lab" />

    <meta property="og:image:width" content="1200" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="App Development Company | Adeeb Technology Lab" />

    <!-- Apply the saved light/dark choice before the page paints, so there is no flash. -->
    <script>
      try {
        var t = localStorage.getItem('atl-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Please enable JavaScript to view Adeeb Technology Lab's app portfolio.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
